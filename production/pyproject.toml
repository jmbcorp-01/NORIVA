[project]
name = "noriva-production"
version = "0.1.0"
description = "NORIVA webtoon production pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10",
    "httpx>=0.28",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
