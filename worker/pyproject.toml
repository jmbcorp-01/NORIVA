[project]
name = "noriva-worker"
version = "0.1.0"
description = "NORIVA 제작 서버: 스튜디오가 큐에 넣은 작업을 꺼내 에이전트를 실행해요"
requires-python = ">=3.11"
dependencies = [
  "anthropic==2.10.0",
  "psycopg[binary]==3.3.9",
  "boto3>=1.35",
  "httpx>=0.27",
  "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
noriva-worker = "noriva_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["noriva_worker*"]
